# Weekly dependency updates. Minor/patch bumps are grouped into one PR per
# ecosystem; major bumps arrive as individual PRs for separate review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

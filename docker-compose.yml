version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-algorithms-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ai-algorithms-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-algorithms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    # No VITE_API_URL here: Vite env vars are baked in at build time, not
    # read at container runtime, so setting it here as a runtime env var
    # would do nothing. The built app calls the API via relative paths
    # (see frontend/src/services/api.ts), which nginx proxies to backend:8000
    # (see nginx.conf) -- works regardless of what host this is served from.
    restart: unless-stopped
    networks:
      - ai-algorithms-network

networks:
  ai-algorithms-network:
    driver: bridge

volumes:
  backend_cache:
